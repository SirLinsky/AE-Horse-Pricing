<!-- HTML=STRUCTURE CSS=APPEARANCE JS=BEHAVIOUR -->
<!-- HTML START -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AE Horse Pricing</title>

<link rel="icon" href="https://raw.githubusercontent.com/SirLinsky/pricing-assets/main/favicon.png?v=999">

<!--CSS / CASCADING STYLE SHEETS START -->
<style>
body {
  font-family: Calibri, sans-serif;
  color: #fff;
  padding: 20px;

  background: url("https://raw.githubusercontent.com/SirLinsky/pricing-assets/main/pricing-background.png")
    center / cover no-repeat fixed;
}

.container {
  max-width:750px;
  margin:auto;
  background: rgba(0, 0, 0, 0.8);
  padding:20px;
  border-radius:10px;
}

select, input {
  width:100%;
  padding:8px;
  margin:5px 0 15px 0;
  background:#2a2a2a;
  color:white;
  border:none;
}

button {
  width:100%;
  padding:12px;
  border:none;
  font-size:16px;
  cursor:pointer;
  border-radius:6px;
}

#calcBtn {
  background:#ff661a;
  color:#ffeee6;
  font-weight:bold;
}

#copyBtn {
  background:#444;
  color:white;
  margin-top:10px;
  display:none;
}

.section {
  margin-bottom:20px;
  padding-bottom:10px;
  border-bottom:1px solid #333;
}

#rpSection {
  display:none;
  background:#222;
  padding:10px;
  border-radius:8px;
}

.result {
  margin-top:20px;
  font-size:16px;
  white-space:pre-line;
  background:#0f0f0f;
  padding:10px;
  border-radius:8px;
}
</style>
<!-- CSS END -->

</head>

<body>

<div class="container">

<h2>AE Horse Pricing System</h2>

<!--INPUT-->
<div class="section">

<label>Breeds</label>
<input list="breedList" id="breed" placeholder="Search breed...">
<datalist id="breedList"></datalist>

<label>Bred / Custom / Caught</label>
<select id="bred">
  <option value="bred">Bred</option>
  <option value="custom">Custom</option>
  <option value="caught">Caught</option>
</select>

<div id="breedtypeSection">
<label>Purebred / Mixed</label>
<select id="breedtype">
  <option value="1.2">Purebred</option>
  <option value="0.9">Mixed</option>
</select>
</div>

<label>Sex</label>
<select id="sex">
<option value="1.05">Mare</option>
<option value="1.05">Stallion</option>
<option value="0.9">Gelding</option>
<option value="0.8">Spayed</option>
</select>

<label>Pattern</label>
<select id="pattern">
</select>

<label>Color</label>
<select id="color">
</select>

<label>XP</label>
<input type="number" id="xp" min="0" max="10000" step="100" value="0">

<label>Max Stats</label>
<select id="maxStats">
  <option value="0">No</option>
  <option value="0.15">Yes</option>
</select>

<label>RP Enabled?</label>
<select id="rp" onchange="toggleRP()">
<option value="0">No</option>
<option value="1">Yes</option>
</select>

</div>

<!--RP SECTION-->
<div id="rpSection">

<label>Age</label>
<select id="age">
<option value="0.8">Unknown</option>
<option value="1.1">1-3</option>
<option value="1.05">3-6</option>
<option value="1.03">6-10</option>
<option value="1.02">10-15</option>
<option value="0.99">15-20</option>
<option value="0.95">20+</option>
</select>

<label>Full Lineage</label>
<select id="lineage">
<option value="1">No</option>
<option value="1.1">Yes</option>
</select>

<label>Experience</label>
<select id="exp">
<option value="0.8">Unknown</option>
<option value="0.83">Unhandled</option>
<option value="1.03">Started</option>
<option value="1.08">Green</option>
<option value="1.2">Intermediate</option>
<option value="1.25">Advanced</option>
<option value="1.3">Elite</option>
</select>

<label>Competition Placings</label>
<select id="comp">
<option value="1">No</option>
<option value="1.2">Yes</option>
</select>

<label>Health Status</label>
<select id="health">
<option value="0.85">Unknown</option>
<option value="1.06">Clean record</option>
<option value="0.95">Minor past injuries</option>
<option value="0.85">Moderate past injuries</option>
<option value="0.75">Severe past injuries</option>
<option value="0.7">Current injury</option>
<option value="0.5">Chronic condition</option>
</select>

<label>Papers Available</label>
<select id="papers">
<option value="1">No</option>
<option value="1.1">Yes</option>
</select>

</div>

<!--BUTTONS-->
<button id="calcBtn" onclick="calculate()">Calculate Horse Price</button>

<div class="result" id="result"></div>

<button id="copyBtn" onclick="copyText()">Copy Breakdown</button>
  
</div>
<!-- JAVA SCRIPT START -->
<script>

// DOM / DOCUMENT OBJECT MODEL
 //     const=  creates a variable whose reference never changes (the values inside the HTML elements can still change, e.g. what the user types), "Eingabefeld"
  // every input/output element by id to use below
const breed = document.getElementById("breed"); //breed search input
const bred = document.getElementById("bred"); //bred/custom dropdown
const sex = document.getElementById("sex"); //sex dropdown
const patternSelect = document.getElementById("pattern"); //pattern dropdown
const colorSelect = document.getElementById("color"); //color dropdown
const breedtype = document.getElementById("breedtype"); //purebred/mixed dropdown
const breedtypeSection = document.getElementById("breedtypeSection"); //divider/wrapper to show/hide the breedtype section
const xp = document.getElementById("xp"); //XP number input
const maxStats = document.getElementById("maxStats"); //max stats yes/no dropdown
const rp = document.getElementById("rp"); //RP enabled yes/no dropdown
const rpSection = document.getElementById("rpSection"); //divider/wrapper to show/hide the RP section
const result = document.getElementById("result"); //output box for the breakdown
const copyBtn = document.getElementById("copyBtn"); //copy breakdown button

 //RP only fields 
const age = document.getElementById("age");
const lineage = document.getElementById("lineage");
const exp = document.getElementById("exp");
const comp = document.getElementById("comp");
const health = document.getElementById("health");
const papers = document.getElementById("papers");
  
// BASE PRICES
  //fixed starting price value per breed as a foundation
const breeds = {
"Akhal Teke": 8100,
"American Appendix Horse": 8500,
"American Cream Draft": 5400,
"American Saddlebred": 7650,
"American Standardbred": 6300,
"American Miniature Horse": 7000,
"American Paint Horse": 6300,
"Anglo-Arabian": 7200,
"Appaloosa": 6300,
"AraAppaloosa": 8100,
"Arabian": 8100,
"Ardennes": 6300,
"Azteca Horse": 7200,
"Barock Pinto": 7200,
"Belgian Draft": 6300,
"Black Forest": 6400,
"Breton": 6300,
"Camargue": 5400,
"Canadian Horse": 5400,
"Cleveland Bay": 5400,
"Clydesdale":6300 ,
"Colorado Ranger": 8100,
"Comtois": 6300,
"Connemara": 5400,
"Criollo": 6750,
"Donkey": 4500,
"Draft Mule": 5400,
"Dutch Warmblood": 6750,
"Egyptian Arabian": 7200,
"Emberian": 9000,
"Exmoor": 5400,
"Fjord": 6750,
"Foundation American Quarter Horse": 7200,
"Frederiksborger": 7650,
"Friesian": 7200,
"German Riding Pony": 6300,
"Haflinger": 5400,
"Horses Of The Apocalypse": 9000,
"Holsteiner": 7200,
"Hungarian Halfbred": 6750,
"Icelandic": 6300,
"Irish Cob": 6300,
"Kentucky Saddler": 6300,
"Kinsky Horse": 7200,
"Kladruber": 7200,
"Knabstrupper": 6300,
"Lewitzer": 5500,
"Puro Sangue Lusitano": 7200,
"Mammoth Jackstock": 5400,
"Mangy": 4500,
"Menorquin": 7650,
"Merens": 7650,
"Missouri Fox Trotter": 8100,
"Performance American Quarter Horse": 7200,
"Morgan": 6300,
"Mule": 4500,
"Murgese": 7200,
"Mustang": 6750,
"Nez Perce": 8100,
"Nokota": 6750,
"Norfolk Roadster": 7200,
"Noriker": 4950,
"Oldenburger": 7200,
"Paso Fino": 7200,
"Percheron": 5400,
"Pintabian": 8100,
"Pura Raza Espanola": 7200,
"Przewalski": 7200,
"Rocky Mountain Horse": 7200,
"Selle Francais": 7200,
"Shetland": 4050,
"Shire": 6300,
"Standard Lusitano": 7200,
"Suffolk Punch": 5400,
"Sugarbush Harlequin": 6300,
"Tennessee Walker": 6750,
"Thoroughbred": 8100,
"Tiger Horse": 8100,
"Trotteur Francais": 7200,
"Turkoman": 8100,
"Warlander": 5400,
"Welsh Cob": 5400,
"Welsh Pony": 5400,
"Zebra": 5400
};

// PATTERNS
  // percentage bonus added depending on pattern
const patterns = {
"Solid":0.2,
"Leopard":0.25,
"Blanket":0.25,
"Snowflake":0.25,
"Few Spotted":0.25,
"Tovero":0.35,
"Sabino":0.30,
"Tobiano":0.35,
"Overo":0.35,
"Zebra":0.1,
"Splashed White":0.3,
"Rabicano":0.3,
"Brindle":0.25,
"Dun":0.3,
"Roan":0.3
};

// COLORS
    // percentage bonus added depending on color
const color = {
"Chestnut":0.2,
"Black":0.2,
"Bay":0.2,
"Flaxen Chestnut":0.2,
"Pangare Chestnut":0.2,
"Pangare Bay":0.2,
"Palomino":0.22,
"Buckskin":0.22,
"Smokey Black":0.22,
"Cremello":0.24,
"Perlino":0.24,
"Smokey Cream":0.24,
"Gold Champagne":0.23,
"Amber Champagne":0.23,
"Classic Champagne":0.23,
"Gold Cream Champagne":0.25,
"Classic Cream Champagne":0.25,
"Amber Cream Champagne":0.25,
"Grey":0.2,
"Rose Grey":0.21,
"Dominant White":0.25,
"Red Mushroom":0.25,
"Bay Mushroom":0.25,
"Silver Black":0.23,
"Silver Bay":0.23,
"Silver Smokey Black":0.24,
"Silver Buckskin":0.25
};

window.onload = () => { //the following fuction that run at the end of loading the page

 const breedList = document.getElementById("breedList"); //data list for breed search

  const patternSelect = document.getElementById("pattern"); //pattern drop down selection
  const colorSelect = document.getElementById("color"); //color drop down selection

  let sorted = Object.keys(breeds).sort(); // have breeds sorted alphabetically

  for (let b of sorted) { //"loop through" (analyze) each breed key."b" variable for "breed"
    breedList.innerHTML += `<option value="${b}">`; //make each breed a dropdown option
  }

  for (let p in patterns) { //"loop through" each pattern key
    patternSelect.innerHTML += `<option value="${p}">${p}</option>`; //make each pattern a dropdown option
  }

  for (let c in color) { //"loop through" each color key
    colorSelect.innerHTML += `<option value="${c}">${c}</option>`; //make each color a dropdown option
  }

toggleBreedType(); //set the correct default visibility of the breedtype on load 
};

function toggleRP(){ //show/hide RP section , reset RP fields if disabled
  rpSection.style.display = rp.value == "1" ? "block" : "none"; // toggle visibility

  if (rp.value == "0") { // if RP is set to no the following variables wont have multipliers/ wont count in

    age.value = "1";
    lineage.value = "1";
    exp.value = "1";
    comp.value = "1";
    health.value = "1";
    papers.value = "1";
  }
}

function toggleBreedType() { //show/hide purebred/mixed dropdown 
  if (bred.value === "custom" || bred.value === "caught") { //hide breedtype when select "custom" or "caught"
    breedtypeSection.style.display = "none";
  } else {
    breedtypeSection.style.display = "block";
  }
}

let lastBreakdown = ""; //store last generated breakdown text for the copy button, at the beginning empty
let hasCalculated = false; //track if calculate button has already been pressed

// MAIN CALCULATION
function calculate(){ //main calculation fuction

hasCalculated = true; //enabled that if he calculation has happened (via button) live updates start

let breedName = breed.value.trim(); //checks teh entered breed name and corrects it (removing extra spaces)
let base = breeds[breedName]; //checks base price and adds

let appearanceAdd = 0; //starting total for apperance category
let performanceAdd = 0;
let conditionAdd = 0;
let otherAdd = 0;

let total = base * //start with the base price
parseFloat(sex.value) * //multiply by sex modifyer
(1 + (patterns[patternSelect.value] ?? 0)) * // add pattern bonus
(1 + (color[colorSelect.value] ?? 0)) *// add color bonus
parseFloat(breedtype.value); // multiply by purebred/mixed multiplier

let rpMult = 1; // RP multiplier is neutral by default 

if(rp.value == "1"){ //only apply RP factors if RP is enabled
rpMult =
parseFloat(age.value) *
parseFloat(lineage.value) *
parseFloat(exp.value) *
parseFloat(comp.value) *
parseFloat(health.value) *
parseFloat(papers.value);
}

total *= rpMult; // apply RP multipliers to total

//CATEGORIES
// APPEARANCE
appearanceAdd = //Value added by color+pattern
base * (color[colorSelect.value] ?? 0) +
base * (patterns[patternSelect.value] ?? 0);

// CONDITION (always applies)
conditionAdd = //Value added/removed by sex + breedtype
base * (parseFloat(sex.value)-1) +
base * (parseFloat(breedtype.value)-1);

// BREEDING FEE
let breedingBonus = 0;
if (bred.value == "bred") { //add money fee when horse is bred
    breedingBonus = 1500; // amount of fee
    total += breedingBonus; //add breeding fee to total
}

// WILD HORSE BONUS
  let caughtBonus = 0;
if (bred.value == "caught") { //add bonus for catching a wild horse
    caughtBonus = 500; // amount of bonus
    total += caughtBonus; //add caught bonus to total
    otherAdd += caughtBonus; //show it in the OTHER category in breakdown
}

//PERFORMANCE ALWAYS
let maxStatsBonus = 0;
if (maxStats.value === "0.15") { //add bonus if max stats is selected
  maxStatsBonus = base * 0.15; //amount of bonus (15%)
  total += maxStatsBonus;
  performanceAdd += maxStatsBonus; // add to performance section in breakdown
}

if (rp.value == "1") { //RP only breakdown additions

  // PERFORMANCE RP
performanceAdd += //Value added from experience and competition
base * (parseFloat(exp.value)-1) +
base * (parseFloat(comp.value)-1);

// CONDITION (RP only)
conditionAdd += //Value added from age+health
base * (parseFloat(age.value)-1) +
base * (parseFloat(health.value)-1);

  // OTHER
  otherAdd = //Value added from lineage and papers
  base * (parseFloat(lineage.value)-1) +
  base * (parseFloat(papers.value)-1);

} else {
  otherAdd = 0; //Other cat is 0 if RP is toggled off, its also removed frm breakdown 
}

// XP
let xpVal = parseInt(xp.value) || 0; //read XP as number
if (xpVal > 10000) { //clamps to max, cant go above 10k
  xpVal = 10000;
}
if (xpVal < 0) { //clamps to min, cant go below 0
  xpVal = 0;
}
xp.value = xpVal; // if number outside of min/max write clamped min/max back in the field

let xpFactor = xpVal === 10000 ? 0.35 : 0.25; //higher bonus if max xp instead of the normal multiplier
let xpBonus = xpVal * xpFactor; //dollar bonus from xp from multipliying
total += xpBonus; //add xp bonus to total

// Bonding Bonus
let bondingBonus = 0; //bonding bonus based on XP treshholds

if (xpVal >= 8000) {
  bondingBonus = 0.09;
} else if (xpVal >= 6000) {
  bondingBonus = 0.06;
} else if (xpVal >= 4000) {
  bondingBonus = 0.03;
}
performanceAdd += base * bondingBonus; //add bonding bonus to performance breakdown
total += base * bondingBonus; //add bonding bonus to total

// Round up to the next 500
let roundedPrice = Math.ceil(total / 500) * 500; //round up the price to 500's

// F12 Debug output — quick overview of the final category totals
console.log("Base Price:", Math.round(base));
console.log("Appearance:", Math.round(appearanceAdd));
console.log("Performance:", Math.round(performanceAdd));
console.log("Condition:", Math.round(conditionAdd));
console.log("XP Bonus:", Math.round(xpBonus));
console.log("Other:", Math.round(otherAdd));
console.log("Final Price:", Math.round(total));

//LAST BREAKDOWN
lastBreakdown = //build the multi line breakdown text shown to user
`BASE PRICE: $${Math.round(base)}

${bred.value === "bred" ? `BREEDING FEE: +$${breedingBonus}\n` : ""}

APPEARANCE: ${appearanceAdd >= 0 ? "+" : "-"}$${Math.round(Math.abs(appearanceAdd))}

PERFORMANCE: ${performanceAdd >= 0 ? "+" : "-"}$${Math.round(Math.abs(performanceAdd))}

CONDITION: ${conditionAdd >= 0 ? "+" : "-"}$${Math.round(Math.abs(conditionAdd))}

XP: +$${Math.round(xpBonus)}

${rp.value === "1" ? `OTHER: ${otherAdd >= 0 ? "+" : "-"}$${Math.round(Math.abs(otherAdd))}\n` : ""}

────────────────────

FINAL PRICE: $${Math.round(total)}

RECOMMENDED LISTING PRICE: $${roundedPrice}`;

result.innerText = lastBreakdown; //display breakdown to user
copyBtn.style.display = "block"; //reveal the copy button 
}

  // FUNCTIONS AND EVENT LISTENERS

    function copyText(){
      navigator.clipboard.writeText(lastBreakdown);  // copy breakdown text to clipboard
      alert("Copied breakdown!");  // show confirmation popup
    }

    xp.addEventListener("input", () => { // runs on every keystroke in XP field
      let val = parseInt(xp.value); //analyze xp input and convert to number for function
      if (isNaN(val)) val = 0; // NaN if not a valid number
      if (val > 10000) xp.value = 10000; //cant go above 10k -> enforce limit
      if (val < 0) xp.value = 0; // cant go below 0 -> enforce min limit
    });

    rp.addEventListener("change", () => { //run this function when rp dropdown changes
      toggleRP(); // action-> show/hide rp section depending on dropdown selection
      if (hasCalculated) calculate(); // if calculate button has been pressed alreday, change the calculation live if changes are taken
    });

    bred.addEventListener("change", () => { //run this function when Bred/Custom dropdown changes
      toggleBreedType(); // action-> show/hide purebred/mixed section depending on dropdown selection
      if (hasCalculated) calculate();  // if calculate button has been pressed alreday, change the calculation live if changes are taken
    });

    const autoUpdateFields = [ // all elements being updated in the calculation automatically without pressing calculate again
      breed, sex, patternSelect, colorSelect, breedtype,
      xp, maxStats,
      age, lineage, exp, comp, health, papers
    ];

    autoUpdateFields.forEach((field) => { //"loop through"
      field.addEventListener("input", () => { // automatically changes calculation if an input has been changed
        if (hasCalculated) calculate();
      });
      field.addEventListener("change", () => { // automatically changes calculation if a dropdown menu has been changed
        if (hasCalculated) calculate();
      });
    });

console.log("DEBUG: autoUpdateFields Anzahl:", autoUpdateFields.length);
console.log("DEBUG: erstes Element:", autoUpdateFields[0]);

  </script> <!-- JAVA SCRIPT END -->


</body>

</html> <!--HTML END / PAGE END -->
